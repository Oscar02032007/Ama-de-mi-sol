<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0d12">
  <title>Ama De Mi Sol - Milo J</title>
  <link rel="icon" href="ojitodelabebe.jpeg" type="image/jpeg">
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
  <main class="player">
    <p class="page-phrase">A ti te gusta Milo J y a mi me gustas tu</p>

    <button type="button" class="cover-btn" id="coverBtn" aria-label="Ver portada a tamaño completo">
      <img id="cover" src="ojitodelabebe.jpeg" alt="Portada de Ama De Mi Sol">
    </button>

    <div class="info">
      <h1 id="title">Ama De Mi Sol</h1>
      <p id="artist">Milo J</p>
    </div>

    <div class="subtitles">
      <div class="sub-current" id="pageSubCurrent"></div>
      <div class="sub-next" id="pageSubNext"></div>
    </div>

    <div class="controls">
      <button type="button" id="playBtn" class="ctl play-btn" aria-label="Reproducir">
        <svg id="iconPlay" viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="iconPause" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" hidden><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
    </div>

    <div class="timeline">
      <span id="current">0:00</span>
      <input type="range" id="seek" min="0" max="0" value="0" step="0.1" aria-label="Progreso">
      <span id="duration">0:00</span>
    </div>

    <audio id="audio" src="ama-de-mi-sol.mp3" preload="metadata"></audio>
  </main>

  <div class="modal" id="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Portada">
    <button type="button" class="modal-close" id="modalClose" aria-label="Cerrar">&times;</button>
    <p class="modal-phrase">A ti te gusta Milo J y a mi me gustas tu</p>
    <div class="modal-body">
      <img src="ojitodelabebe.jpeg" alt="Portada de Ama De Mi Sol">
    </div>
    <div class="modal-sub" id="modalSub" aria-live="off">
      <div class="sub-current" id="subCurrent"></div>
      <div class="sub-next" id="subNext"></div>
    </div>
  </div>

  <script src="lyrics.js?v=6"></script>
  <script src="script.js?v=6"></script>
</body>
</html>
